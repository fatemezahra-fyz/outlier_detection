services:
  api:
    build: .
    ports:
      - "9000:8000"
    volumes:
      - ./data:/app/data
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000
    restart: always

  dashboard:
    build: .
    ports:
      - "9001:8501"
    volumes:
      - ./data:/app/data
    command: streamlit run dashboard/dashboard.py --server.port 8501 --server.address 0.0.0.0
    depends_on:
      - api
    restart: always

volumes:
  data:
